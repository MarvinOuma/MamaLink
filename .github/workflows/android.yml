name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5
      - name: Build, test and lint
        run: ./gradlew --no-daemon :app:build :app:lintDebug :app:lintRelease
      - name: Verify committed Room schema
        if: always()
        run: |
          git diff -- app/schemas
          test -z "$(git status --porcelain -- app/schemas)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mamalink-stage1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/schemas/
            app/build/reports/lint-results-*
          if-no-files-found: warn
